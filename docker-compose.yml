services:
  db:
    image: postgres:16
    container_name: matricula_db
    environment:
      POSTGRES_USER: matricula_user
      POSTGRES_PASSWORD: matricula_password
      POSTGRES_DB: matricula_db
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - max_connections=100   # límite duro C6 (97 útiles); alineado con la Entrega 1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U matricula_user -d matricula_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: dockerfile.api
    container_name: matricula_api
    environment:
      POSTGRES_USER: matricula_user
      POSTGRES_PASSWORD: matricula_password
      POSTGRES_DB: matricula_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Variables de decisión (escenario base de la Entrega 1)
      # Se pueden sobrescribir al lanzar, p. ej.:  DB_POOL_SIZE=5 docker compose up -d --force-recreate api
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-0}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
    ports:
      - "8000:8000"
    volumes:
      - ./datos:/app/datos   # <--- Compartición de volumen para guardar telemetry_log.csv
    depends_on:
      db:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: dockerfile.streamlit
    container_name: matricula_streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data: